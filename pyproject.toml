[project]
name = "pylander"
version = "0.1.0"
description = "Lunar lander game with procedural terrain and bot support."
requires-python = ">=3.13"
dependencies = [
    "pymunk>=7.1.0",
    "matplotlib>=3.9.2",
    "pygame-ce>=2.5.6",
]

[project.optional-dependencies]
bot = [
    "cvxpy>=1.8.1",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.2",
    "vulture>=2.14",
]
# Bot extras (includes cvxpy for PDG optimizer):
#   uv install --optional bot
#   uv sync --extra bot

[tool.pytest.ini_options]
addopts = "-n auto --dist load"
markers = [
    "bot_extra: tests that require bot extras (cvxpy/pdg optimizer)",
]
